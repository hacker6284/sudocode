name: Release binaries

# Tag v* → build the matched SET of per-platform binaries (via Bazel — cargo is
# retired) → GitHub release with checksums. The set is what rules_sudo 1.0.0's
# hermetic decomposed lockstep needs, all built from ONE commit: `sudoc` (emits
# codegen / recipes / tests-manifest) plus the harness tools `lockstep_diff`,
# `capture_run`, `emit_unpack` (consume them). Downstream consumers pin a version
# + sha256 (rules_sudo/versions.bzl) instead of building from floating main.
# workflow_dispatch rehearses the builds without releasing anything.
#
# Matched-pair sha256 injection (design §8 Phase 4.5 — Fable's guidance): the
# rules_sudo tarball published INSIDE this release must carry this release's own
# binary sha256s, but those only exist after the binaries build. So the release
# job computes each built binary's sha256 and injects them into
# rules_sudo/versions.bzl (tools/inject_release_shas.py <versions.bzl> <sha_dir>
# <tag>) BEFORE packaging the tarball. The in-repo PENDING block names the next
# planned tag with empty shas; the workflow's tag argument is what actually gets
# injected (it need not match the in-repo placeholder).
#
# rules_sudo packaging self-gate: an earlier gate SKIPPED the tarball because the
# launcher execed the retired `sudoc test` subcommand (a sudoc that no longer has
# it → broken pair). Phase 5 ported the launcher to the decomposed
# sudoc/lockstep_diff/capture_run/emit_unpack tools, so the gate is now a
# regression guard — it FAILS the release if that retired exec ever reappears,
# and otherwise always packages.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build the matched set (Bazel, optimized, native for this runner)
        run: |
          bazel build -c opt \
            //sudoc/crates/cli:sudoc \
            //sudoc/crates/harness:lockstep_diff \
            //sudoc/crates/harness:capture_run \
            //sudoc/crates/harness:emit_unpack
      - name: Smoke (embedded stdlib present)
        run: |
          printf 'import std.strings\n\ntest "std import works"\n    assert strings.to_upper("ok") == "OK"\n' > /tmp/smoke.sudo
          bazel-bin/sudoc/crates/cli/sudoc check /tmp/smoke.sudo
      - name: Package (each asset in the matched set + its .sha256)
        run: |
          set -euo pipefail
          # NB: macOS runners ship bash 3.2 (no associative arrays / `declare -A`).
          # Use a colon-separated name:path pair list (paths contain no colons).
          for pair in \
            "sudoc:bazel-bin/sudoc/crates/cli/sudoc" \
            "lockstep_diff:bazel-bin/sudoc/crates/harness/lockstep_diff" \
            "capture_run:bazel-bin/sudoc/crates/harness/capture_run" \
            "emit_unpack:bazel-bin/sudoc/crates/harness/emit_unpack"; do
            asset="${pair%%:*}"
            src="${pair#*:}"
            out="${asset}-${{ matrix.target }}"
            cp "$src" "$out"
            shasum -a 256 "$out" > "$out.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            sudoc-${{ matrix.target }}*
            lockstep_diff-${{ matrix.target }}*
            capture_run-${{ matrix.target }}*
            emit_unpack-${{ matrix.target }}*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Inject this release's binary sha256s into rules_sudo/versions.bzl
        # Fills the PENDING inject block from the freshly-computed
        # <asset>-<triple>.sha256 files BEFORE the tarball is packaged, so the
        # shipped ruleset pins its own release's binaries. The tag argument
        # (${{ github.ref_name }}) is authoritative — the in-repo PENDING
        # placeholder only names the next planned tag. Fails loudly if any
        # asset×platform sha is absent.
        run: |
          python3 tools/inject_release_shas.py rules_sudo/versions.bzl . "${{ github.ref_name }}"
          echo "----- injected versions.bzl (PENDING / ${{ github.ref_name }} block) -----"
          sed -n '/INJECT-RELEASE-BEGIN/,/INJECT-RELEASE-END/p' rules_sudo/versions.bzl
      - name: Package rules_sudo (regression-guard the retired `sudoc test` exec)
        run: |
          set -euo pipefail
          if grep -rqF '"$SUDOC_BIN" test' rules_sudo --include='*.bzl'; then
            echo "::error::rules_sudo still execs the retired 'sudoc test' subcommand, which the sudoc binary in this release no longer has. Packaging it would ship a broken pair. Port the launcher off 'sudoc test' before releasing."
            exit 1
          fi
          tar czf rules_sudo-${{ github.ref_name }}.tar.gz \
            --exclude='rules_sudo/e2e' \
            rules_sudo
      - name: Extract CHANGELOG section for this tag
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if grep -qE "^## ${tag}$" CHANGELOG.md; then
            awk -v tag="$tag" '
              $0 == "## " tag { found=1; print; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > RELEASE_BODY.md
          else
            echo "::warning::No ## ${tag} section in CHANGELOG.md; release body will be empty (auto-generated notes still apply)"
            : > RELEASE_BODY.md
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            sudoc-*
            lockstep_diff-*
            capture_run-*
            emit_unpack-*
            rules_sudo-*.tar.gz
          body_path: RELEASE_BODY.md
          generate_release_notes: true
