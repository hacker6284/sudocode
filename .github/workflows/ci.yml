name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Bazel migration (Phase 4): CI is Bazel-only — cargo is fully retired. This
  # job builds + tests the compiler AND the decomposed lockstep suite across all
  # 7 backends — //conformance, //stdlib, //examples (py, js, c, rs, zig, swift,
  # hs) — on Linux; the bazel-macos job below is its macOS sibling (the success
  # criteria require green on both). Correctness gates enforced under Bazel:
  # clippy -Dwarnings (--config=clippy aspect), unsafe_code=forbid (rustc_flags),
  # rustdoc -Dwarnings (rust_doc per crate), C sanitizers (in the c recipe).
  # Uses the BuildBuddy remote cache; cache WRITE is gated to trusted pushes
  # (PRs, incl. forks, read-only). The lockstep run-leaves are tags=["local"] and
  # execute each backend's recipe under the runner's host toolchains (python3,
  # node, cc, rustc preinstalled; zig via setup-zig, swiftc via setup-swift, ghc
  # via haskell-actions/setup).
  bazel:
    name: Bazel build+test (compiler + conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      # GHC for the external hs backend: its codegen action shells out to
      # `runghc Emit.hs` (spec §8 Phase 3 "system-GHC no-sandbox leaf"), so GHC
      # must be on PATH for `bazel build` below. ~/.ghcup restores in <1 min.
      - name: Cache GHC
        uses: actions/cache@v4
        with:
          path: ~/.ghcup
          key: ghcup-${{ runner.os }}-${{ runner.arch }}-ghc-9.10.1
      - name: Haskell toolchain (ghc)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.1"
          cabal-update: false
      # Build BEFORE setup-swift: the Swift toolchain pollutes PATH/linker and
      # breaks the host rust build (rules_rust process_wrapper fails to link —
      # "collect2: cannot find 'ld'"). Building first in a clean env caches all
      # artifacts; the later `bazel test` under swift's PATH reuses them (no
      # relink) — only the tags=local test run-leaves pick up host swiftc.
      - name: Bazel build (compiler + conformance; clean env)
        env:
          BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BB_KEY:-}" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "::warning::BUILDBUDDY_API_KEY is not set — the BuildBuddy remote cache + BES are DISABLED on this trusted push, so the cache and its fork-PR write-gating run untested. Set the BUILDBUDDY_API_KEY repository secret to enable them."
          fi
          FLAGS=(--config=clippy)
          if [ -n "${BB_KEY:-}" ]; then
            FLAGS+=(--remote_cache=grpcs://remote.buildbuddy.io)
            FLAGS+=(--remote_header=x-buildbuddy-api-key="$BB_KEY")
            FLAGS+=(--bes_backend=grpcs://remote.buildbuddy.io)
            FLAGS+=(--bes_results_url=https://app.buildbuddy.io/invocation/)
            if [ "${{ github.event_name }}" = "push" ]; then
              FLAGS+=(--remote_upload_local_results)
            else
              FLAGS+=(--noremote_upload_local_results)
            fi
          fi
          bazel build "${FLAGS[@]}" //sudoc/crates/... //conformance/... //stdlib/... //examples/...
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.2"
      - name: Bazel test (remote cache; write only on trusted pushes)
        env:
          BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BB_KEY:-}" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "::warning::BUILDBUDDY_API_KEY is not set — the BuildBuddy remote cache + BES are DISABLED on this trusted push, so the cache and its fork-PR write-gating run untested. Set the BUILDBUDDY_API_KEY repository secret to enable them."
          fi
          FLAGS=(--config=clippy)
          if [ -n "${BB_KEY:-}" ]; then
            FLAGS+=(--remote_cache=grpcs://remote.buildbuddy.io)
            FLAGS+=(--remote_header=x-buildbuddy-api-key="$BB_KEY")
            FLAGS+=(--bes_backend=grpcs://remote.buildbuddy.io)
            FLAGS+=(--bes_results_url=https://app.buildbuddy.io/invocation/)
            if [ "${{ github.event_name }}" = "push" ]; then
              FLAGS+=(--remote_upload_local_results)
            else
              FLAGS+=(--noremote_upload_local_results)
            fi
          fi
          bazel test "${FLAGS[@]}" --test_output=errors //sudoc/crates/... //conformance/... //stdlib/... //examples/...

  # Bazel on macOS — the success criteria require the suite green on Linux AND
  # macOS. macos-latest ships every run-leaf toolchain (clang, python3, node,
  # swiftc via Xcode, rustc); zig + GHC are installed here. Unlike Linux, macOS
  # swiftc is the system Apple toolchain and shares the system linker, so it does
  # NOT pollute the rules_rust build — no build-before-setup-swift split is
  # needed and no setup-swift step (swiftc is preinstalled). The C run leaf uses
  # system clang (asan,ubsan; LSan is a Linux-only no-op, so its ASAN_OPTIONS
  # flag is inert here). hermetic_cc is not on the run path (host cc is), so the
  # spec's macOS-sysroot caveat does not apply.
  bazel-macos:
    name: Bazel build+test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Cache GHC
        uses: actions/cache@v4
        with:
          path: ~/.ghcup
          key: ghcup-${{ runner.os }}-${{ runner.arch }}-ghc-9.10.1
      - name: Haskell toolchain (ghc)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.1"
          cabal-update: false
      - name: Bazel test (remote cache; write only on trusted pushes)
        env:
          BB_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BB_KEY:-}" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "::warning::BUILDBUDDY_API_KEY is not set — the BuildBuddy remote cache + BES are DISABLED on this trusted push, so the cache and its fork-PR write-gating run untested. Set the BUILDBUDDY_API_KEY repository secret to enable them."
          fi
          FLAGS=(--config=clippy)
          if [ -n "${BB_KEY:-}" ]; then
            FLAGS+=(--remote_cache=grpcs://remote.buildbuddy.io)
            FLAGS+=(--remote_header=x-buildbuddy-api-key="$BB_KEY")
            FLAGS+=(--bes_backend=grpcs://remote.buildbuddy.io)
            FLAGS+=(--bes_results_url=https://app.buildbuddy.io/invocation/)
            if [ "${{ github.event_name }}" = "push" ]; then
              FLAGS+=(--remote_upload_local_results)
            else
              FLAGS+=(--noremote_upload_local_results)
            fi
          fi
          bazel test "${FLAGS[@]}" --test_output=errors //sudoc/crates/... //conformance/... //stdlib/... //examples/...
